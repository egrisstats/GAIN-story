# Publishes the story to GitHub Pages on every push to main.
# Only the page and the files it loads go online; review/, pipeline/ and the full-size covers stay out.
# During GAIN 2026 collection it also runs every 15 minutes to refresh the submissions tracker
# (dashboard/) from Kobo. The Kobo data is written into the published site only, never committed.
name: Publish the story

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * 3-24 11 *"   # GAIN 2026 tracker refresh, 3–24 November (UTC)

permissions:
  contents: read
  pages: write
  id-token: write

# Publishes queue rather than overlap: GitHub Pages refuses a new deployment while the previous one is
# still being processed, which happens when submissions (or pushes) come in quick succession.
# Only the newest waiting run is kept, so the site always ends on the latest data.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # publishes from the original and from the EGRISS copy (egrisstats/GAIN-story)
    if: github.repository == 'mitrovif/GAIN-story' || github.repository == 'egrisstats/GAIN-story'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page and its files
        run: |
          mkdir -p _site/assets/fonts
          cp index.html Main.dc.html support.js _site/
          cp -r vendor _site/
          cp assets/*.json assets/*.png assets/*.jpg _site/assets/
          cp -r assets/covers-web _site/assets/
          cp -r assets/cases _site/assets/
          cp -r assets/recs _site/assets/
          cp -r assets/countries _site/assets/
          cp assets/fonts/Obvia-SemiBold.otf _site/assets/fonts/
          touch _site/.nojekyll
          cp -r campaign _site/
          mkdir -p _site/website/gain-resources
          cp website/gain-resources/GAIN-Resources-page-update.html website/gain-resources/preview.html _site/website/gain-resources/
          mkdir -p _site/dashboard/data _site/dashboard/assets
          cp dashboard/index.html _site/dashboard/
          cp -r dashboard/assets/recs _site/dashboard/assets/
          cp dashboard/data/gain2026_DEMO.csv dashboard/data/gain_history.json dashboard/data/repeat_review.csv dashboard/data/alignment_review.csv _site/dashboard/data/
          # the standalone alignment review page (dashboard/review/): built from alignment/review, with the decision tree and excerpts beside it
          mkdir -p _site/dashboard/review
          python3 alignment/review/build.py --public _site/dashboard/review/index.html
          cp alignment/spec/decision_tree.json alignment/spec/excerpts.json _site/dashboard/review/
      - name: Pull GAIN 2026 submissions from Kobo (no respondent details)
        # without the KOBO_TOKEN secret, or before kobo_config.json is filled in, this skips and the tracker shows demo data
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: |
          python3 dashboard/tools/kobo_to_csv.py
          if [ -f dashboard/data/gain2026.csv ]; then mv dashboard/data/gain2026.csv dashboard/data/gain2026_meta.json _site/dashboard/data/; fi
      - name: Review queue and decisions for the alignment review page (titles and answers only, no descriptions)
        # the queue of No / Don't know examples with similar examples and history, and the decisions saved through
        # the Kobo review form; the tracker's alignment_review.csv comes from the same decisions. Skips without the secret.
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: |
          if [ -n "$KOBO_TOKEN" ] && [ -f _site/dashboard/data/gain2026.csv ]; then
            cp _site/dashboard/data/gain2026.csv dashboard/data/gain2026.csv
            python3 dashboard/tools/review_sync.py public _site/dashboard/data
            rm -f dashboard/data/gain2026.csv
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # if Pages was still busy finishing the previous deployment, wait and try once more
      - name: Wait before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4